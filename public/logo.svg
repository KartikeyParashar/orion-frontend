<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" /> <!-- Indigo 500 -->
      <stop offset="50%" stop-color="#8b5cf6" /> <!-- Violet 500 -->
      <stop offset="100%" stop-color="#d946ef" /> <!-- Fuchsia 500 -->
    </linearGradient>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(10, 15)">
    <!-- Network Globe / Orbit Lines -->
    <ellipse cx="60" cy="65" rx="55" ry="30" fill="none" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.5" transform="rotate(-15 60 65)" />
    <ellipse cx="60" cy="65" rx="20" ry="55" fill="none" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.3" transform="rotate(35 60 65)" />
    
    <!-- Nodes -->
    <circle cx="25" cy="45" r="4" fill="#8b5cf6" />
    <circle cx="85" cy="25" r="5" fill="#d946ef" />
    <circle cx="45" cy="95" r="4" fill="#6366f1" />
    <circle cx="95" cy="85" r="4" fill="#8b5cf6" />
    <circle cx="10" cy="75" r="3" fill="#d946ef" />
    
    <!-- Connection lines -->
    <path d="M25,45 L85,25 L95,85 L45,95 Z" fill="none" stroke="url(#primaryGradient)" stroke-width="1.5" opacity="0.4" />

    <!-- Shopping Cart / Base -->
    <path d="M15,40 L30,40 L45,90 L95,90 L105,50 L40,50" fill="none" stroke="url(#primaryGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="55" cy="110" r="7" fill="url(#primaryGradient)" />
    <circle cx="85" cy="110" r="7" fill="url(#primaryGradient)" />

    <!-- Bar Chart Inside -->
    <rect x="50" y="70" width="10" height="15" fill="url(#primaryGradient)" rx="2"/>
    <rect x="65" y="60" width="10" height="25" fill="url(#primaryGradient)" rx="2"/>
    <rect x="80" y="45" width="10" height="40" fill="url(#primaryGradient)" rx="2"/>

    <!-- Dynamic Upward Arrow -->
    <path d="M30,85 Q60,110 115,20 L130,35 M115,20 L100,5" fill="none" stroke="url(#primaryGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text Group -->
  <text x="155" y="100" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="76" letter-spacing="14" fill="url(#primaryGradient)">ORION</text>
  
  <text x="160" y="130" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="6" fill="url(#primaryGradient)" opacity="0.9">INTELLIGENT SUPPLY CHAIN</text>
</svg>
